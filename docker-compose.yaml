services:
  mongodb:
    image: 'mongo:8.0'
    environment:
      - 'MONGO_INITDB_DATABASE=hotels'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    volumes:
      - ./mongo-data:/data/db
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=hotels'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
